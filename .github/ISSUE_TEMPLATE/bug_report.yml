name: Bug report
description: Something behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        If the bug lets someone cross a tenant boundary, get in without the
        credentials they should need, or act beyond their role, stop here and
        read
        [SECURITY.md](https://github.com/dragon-sec/.github/blob/main/SECURITY.md)
        instead — report it privately, not in this form.

  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - ScaleLock
        - DragonFlight
        - DragonHoard
        - DragonFire
        - DragonWatch
        - InferSight
        - ScaleForge
        - FlameRunner
        - FireSight
        - OathScale
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        Ideally a minimal case. If it involves a particular sign-in flow,
        cluster, device or integration, say which.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit you built from.
    validations:
      required: true

  - type: input
    id: deployment
    attributes:
      label: Deployment
      description: How and where it runs, and the versions of what it depends on.
      placeholder: "Container on Kubernetes 1.34, PostgreSQL 18"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant output. Check it for tokens, secrets, tenant names and
        hostnames before pasting — this is a public issue.
      render: text
