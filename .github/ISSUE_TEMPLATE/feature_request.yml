name: Feature request
description: Propose a capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - ScaleLock
        - DragonFlight
        - DragonHoard
        - DragonFire
        - DragonWatch
        - InferSight
        - ScaleForge
        - FlameRunner
        - FireSight
        - OathScale
        - Across products
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you unable to do today? Describe the situation, not the
        solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: textarea
    id: trust
    attributes:
      label: What it would take to trust it
      description: >
        If this widens what a user, token, tenant or integration can reach, say
        what would make that safe — a narrower scope, an approval step, an
        audit record, a default of off. Requests that widen access without an
        answer here tend to stall.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
